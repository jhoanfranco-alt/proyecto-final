<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragancia selecta</title>

    <link rel="stylesheet" href="css/estilos_damas.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="encabezado">

        <a href="#" >
            <img src="assets/image.png" alt="Logo de Fragancia selecta" class="logo-img">

            <div class="nombre-logo">
                <div class="fragancia selecta">Fragancia selecta</div>
                <div class="calidad">Calidad</div>
                <div class="garantizada">garantizada</div>
            </div>
        </a>

        <form class="buscador" onsubmit="event.preventDefault()">
            <input type="search"
                    placeholder="Buscar perfumes, marcas, promos...">
            <button type="submit">⌕</button>
        </form>

        <a href="#" class="enlace-header">♧ Tienda</a>

        <a href="#" class="pagos">▤ &nbsp; Pagos en línea →</a>

        <a href="#" class="idioma">◎ &nbsp; ES ⌄</a>

</header>
    <nav>
        <a href="index.html">inicio </a>
        <a href="caballero.html">caballero</a>
        <a href="contacto.html">Contacto</a>
    </nav>
    
    <script>
        for (let i = 1; i <= 6; i++) {
            const perfume = document.createElement('div');
            perfume.classList.add('perfume');

            const img = document.createElement('img');
            img.src = `assets/image.png`;
            img.alt = `Perfume ${i}`;

            const nombre = document.createElement('h3');
            nombre.textContent = `Nombre del Perfume ${i}`;

            const familiaOlfativa = document.createElement('p');
            familiaOlfativa.textContent = `Familia olfativa: Descripción ${i}`;

            const precio = document.createElement('p');
            precio.textContent = `Precio: $${(i * 10000).toLocaleString()}`;

            perfume.appendChild(img);
            perfume.appendChild(nombre);
            perfume.appendChild(familiaOlfativa);
            perfume.appendChild(precio);

            document.body.appendChild(perfume);
        }
    </script>
